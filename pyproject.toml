[project]
name = "ict-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow>=15", "pyyaml>=6", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["ict_lab*"]

[tool.pytest.ini_options]
testpaths = ["ict_lab/tests"]
